name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun x ultracite check

      - name: Type Check
        run: bun run check-types --filter=server

      - name: Build
        run: bun run build --filter=server

      - name: Test
        run: bun run test --filter=server
        env:
          BETTER_AUTH_SECRET: test-secret-test-secret-test-secret-test-secret
          BETTER_AUTH_URL: http://localhost:3000
          CORS_ORIGIN: http://localhost:3001
          GOOGLE_GENERATIVE_AI_API_KEY: test-google-key
          GOOGLE_PLACES_API_KEY: test-google-places-key
          RADAR_SECRET_KEY: test-radar-key

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build Web
        run: bun run build --filter=web

  check-db:
    name: Check Database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Check Database Types
        run: bun run check-types --filter=db
