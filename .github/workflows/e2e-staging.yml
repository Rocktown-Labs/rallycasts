name: Staging E2E

on:
  workflow_dispatch:

concurrency:
  group: staging-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-and-test:
    environment: staging
    runs-on: ubuntu-latest
    env:
      STAGE: staging
      ALCHEMY_STATE_FORCE_UPDATE: "true"
      E2E_BASE_URL: https://rallycasts-web-staging.rocktown-labs.workers.dev
      E2E_API_URL: https://rallycasts-server-staging.rocktown-labs.workers.dev
      E2E_RUN_MUX_UPLOAD: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate staging secrets
        env:
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.STAGING_BETTER_AUTH_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          E2E_EMAIL: ${{ secrets.STAGING_E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          E2E_SEED_TOKEN: ${{ secrets.STAGING_E2E_SEED_TOKEN }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          MUX_SIGNING_KEY_ID: ${{ secrets.STAGING_MUX_SIGNING_KEY_ID }}
          MUX_SIGNING_KEY_SECRET: ${{ secrets.STAGING_MUX_SIGNING_KEY_SECRET }}
          MUX_TOKEN_ID: ${{ secrets.STAGING_MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.STAGING_MUX_TOKEN_SECRET }}
          MUX_WEBHOOK_SECRET: ${{ secrets.STAGING_MUX_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          for name in \
            ALCHEMY_PASSWORD \
            ALCHEMY_STATE_TOKEN \
            BETTER_AUTH_SECRET \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            E2E_EMAIL \
            E2E_PASSWORD \
            E2E_SEED_TOKEN \
            GOOGLE_GENERATIVE_AI_API_KEY \
            MUX_SIGNING_KEY_ID \
            MUX_SIGNING_KEY_SECRET \
            MUX_TOKEN_ID \
            MUX_TOKEN_SECRET \
            MUX_WEBHOOK_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: $name is required for staging E2E."
              exit 1
            fi
          done

      - name: Deploy isolated staging
        working-directory: packages/infra
        run: bun x alchemy deploy --stage staging
        env:
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.STAGING_BETTER_AUTH_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          E2E_SEED_TOKEN: ${{ secrets.STAGING_E2E_SEED_TOKEN }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          MUX_SIGNING_KEY_ID: ${{ secrets.STAGING_MUX_SIGNING_KEY_ID }}
          MUX_SIGNING_KEY_SECRET: ${{ secrets.STAGING_MUX_SIGNING_KEY_SECRET }}
          MUX_TOKEN_ID: ${{ secrets.STAGING_MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.STAGING_MUX_TOKEN_SECRET }}
          MUX_WEBHOOK_SECRET: ${{ secrets.STAGING_MUX_WEBHOOK_SECRET }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Generate valid video fixture
        run: bun run e2e:fixture

      - name: Run staging browser checks
        run: bun run e2e
        env:
          E2E_API_URL: https://rallycasts-server-staging.rocktown-labs.workers.dev
          E2E_BASE_URL: https://rallycasts-web-staging.rocktown-labs.workers.dev
          E2E_EMAIL: ${{ secrets.STAGING_E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          E2E_SEED_TOKEN: ${{ secrets.STAGING_E2E_SEED_TOKEN }}
