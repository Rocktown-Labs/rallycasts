name: Deploy Application

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || (github.ref == 'refs/heads/master' && 'prod' || github.ref_name) }}

jobs:
  deploy:
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Validate production observability
        if: ${{ env.STAGE == 'prod' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "ERROR: SENTRY_AUTH_TOKEN must be configured for production source-map uploads."
            exit 1
          fi
          if [ -z "$SENTRY_DSN" ]; then
            echo "ERROR: SENTRY_DSN must be configured for production error reporting."
            exit 1
          fi

      - name: Lint
        run: bun x ultracite check

      - name: Type Check
        run: bun run check-types --filter=server

      - name: Build
        run: bun run build --filter=server

      - name: Test
        run: bun run test --filter=server
        env:
          BETTER_AUTH_SECRET: test-secret-test-secret-test-secret-test-secret
          BETTER_AUTH_URL: http://localhost:3000
          CORS_ORIGIN: http://localhost:3001
          GOOGLE_GENERATIVE_AI_API_KEY: test-google-key
          GOOGLE_PLACES_API_KEY: test-google-places-key
          RADAR_SECRET_KEY: test-radar-key

      - name: Deploy
        run: |
          if [ -z "$R2_BUCKET_NAME" ] || [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_PUBLIC_URL" ]; then
            SETTINGS_FILE="$(mktemp)"
            if curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/rallycasts-server/settings" \
              > "$SETTINGS_FILE"; then
              if [ -z "$R2_BUCKET_NAME" ]; then
                R2_BUCKET_NAME="$(jq -r '.result.bindings[]? | select(.name == "MEDIA_BUCKET" and .type == "r2_bucket") | .bucket_name // empty' "$SETTINGS_FILE")"
                export R2_BUCKET_NAME
              fi
              if [ -z "$R2_ACCOUNT_ID" ]; then
                R2_ACCOUNT_ID="$(jq -r '.result.bindings[]? | select(.name == "R2_ACCOUNT_ID" and .type == "plain_text") | .text // empty' "$SETTINGS_FILE")"
                export R2_ACCOUNT_ID
              fi
              if [ -z "$R2_PUBLIC_URL" ]; then
                R2_PUBLIC_URL="$(jq -r '.result.bindings[]? | select(.name == "R2_PUBLIC_URL" and .type == "plain_text") | .text // empty' "$SETTINGS_FILE")"
                export R2_PUBLIC_URL
              fi
            fi
            rm -f "$SETTINGS_FILE"
          fi
          if [ "${{ env.STAGE }}" = "prod" ] && [ -z "$R2_BUCKET_NAME" ]; then
            echo "ERROR: R2_BUCKET_NAME is not set and MEDIA_BUCKET could not be inherited from rallycasts-server."
            exit 1
          fi
          if [ "${{ env.STAGE }}" = "prod" ]; then
            if ! R2_BUCKETS="$(curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets")"; then
              echo "ERROR: Could not list production R2 buckets."
              exit 1
            fi
            if ! printf "%s" "$R2_BUCKETS" | jq -e '.success == true and (.result.buckets | type == "array")' >/dev/null; then
              echo "ERROR: Cloudflare returned an invalid production R2 bucket list."
              exit 1
            fi
            if ! printf "%s" "$R2_BUCKETS" | jq -e --arg bucket "$R2_BUCKET_NAME" 'any(.result.buckets[]?; .name == $bucket)' >/dev/null; then
              echo "Production R2 bucket is missing; creating it."
              if ! CREATE_BUCKET_OUTPUT="$(bun x wrangler r2 bucket create "$R2_BUCKET_NAME" 2>&1)"; then
                printf '%s\n' "$CREATE_BUCKET_OUTPUT"
                if ! printf '%s' "$CREATE_BUCKET_OUTPUT" | grep -q "already exists, and you own it"; then
                  echo "ERROR: Could not create the production R2 bucket."
                  exit 1
                fi
                echo "Production R2 bucket already exists; continuing."
              else
                printf '%s\n' "$CREATE_BUCKET_OUTPUT"
              fi
            fi

            ZONE_NAME="rallycasts.com"
            CUSTOM_DOMAIN="media.rallycasts.com"
            CUSTOM_DOMAIN_COLLECTION_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$R2_BUCKET_NAME/domains/custom"
            CUSTOM_DOMAIN_URL="$CUSTOM_DOMAIN_COLLECTION_URL/$CUSTOM_DOMAIN"

            get_custom_domain() {
              rm -f "${CUSTOM_DOMAIN_RESPONSE:-}"
              CUSTOM_DOMAIN_RESPONSE="$(mktemp)"
              CUSTOM_DOMAIN_STATUS="$(curl -sS -o "$CUSTOM_DOMAIN_RESPONSE" -w "%{http_code}" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                "$CUSTOM_DOMAIN_URL")"
            }

            get_authoritative_dns() {
              command -v dig >/dev/null 2>&1 || return 1
              AUTHORITATIVE_NAMESERVERS="$(dig +short "$ZONE_NAME" NS @1.1.1.1 2>/dev/null)" || return 1
              [ -n "$AUTHORITATIVE_NAMESERVERS" ] || return 1
              AUTHORITATIVE_DNS_RESPONSE="$(
                for nameserver in $AUTHORITATIVE_NAMESERVERS; do
                  dig +short "$CUSTOM_DOMAIN" CNAME "@$nameserver" || true
                  dig +short "$CUSTOM_DOMAIN" A "@$nameserver" || true
                  dig +short "$CUSTOM_DOMAIN" AAAA "@$nameserver" || true
                done
              )"
            }

            get_public_dns() {
              command -v dig >/dev/null 2>&1 || return 1
              PUBLIC_DNS_RESPONSE="$(
                {
                  dig +short "$CUSTOM_DOMAIN" CNAME @1.1.1.1
                  dig +short "$CUSTOM_DOMAIN" A @1.1.1.1
                  dig +short "$CUSTOM_DOMAIN" AAAA @1.1.1.1
                } 2>/dev/null
              )"
            }

            wait_for_dns() {
              DNS_READY=false
              for _ in $(seq 1 12); do
                if get_custom_domain && [ "$CUSTOM_DOMAIN_STATUS" = "200" ] && jq -e \
                  '.success == true and .result.enabled == true and .result.status.ownership == "active" and .result.status.ssl == "active"' \
                  "$CUSTOM_DOMAIN_RESPONSE" >/dev/null && \
                  get_authoritative_dns && [ -n "$AUTHORITATIVE_DNS_RESPONSE" ]; then
                  DNS_READY=true
                  return 0
                fi
                sleep 5
              done
              return 1
            }

            if ! get_custom_domain; then
              rm -f "$CUSTOM_DOMAIN_RESPONSE"
              echo "ERROR: Could not inspect the production R2 custom domain."
              exit 1
            fi
            if [ "$CUSTOM_DOMAIN_STATUS" = "404" ]; then
              if ! ZONE_RESPONSE="$(curl -fsS \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME&status=active")"; then
                rm -f "$CUSTOM_DOMAIN_RESPONSE"
                echo "ERROR: Could not inspect the production Cloudflare zone."
                exit 1
              fi
              ZONE_ID="$(printf "%s" "$ZONE_RESPONSE" | jq -r 'select(.success == true) | .result[0].id // empty')"
              if [ -z "$ZONE_ID" ]; then
                rm -f "$CUSTOM_DOMAIN_RESPONSE"
                echo "ERROR: Could not resolve the production Cloudflare zone ID."
                exit 1
              fi
              CUSTOM_DOMAIN_PAYLOAD="$(jq -n \
                --arg domain "$CUSTOM_DOMAIN" \
                --arg zoneId "$ZONE_ID" \
                '{domain: $domain, enabled: true, zoneId: $zoneId}')"
              CREATE_RESPONSE="$(mktemp)"
              CREATE_STATUS="$(curl -sS -o "$CREATE_RESPONSE" -w "%{http_code}" -X POST \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$CUSTOM_DOMAIN_PAYLOAD" \
                "$CUSTOM_DOMAIN_COLLECTION_URL")" || {
                rm -f "$CUSTOM_DOMAIN_RESPONSE" "$CREATE_RESPONSE"
                echo "ERROR: Could not create the production R2 custom domain."
                exit 1
              }
              if [[ ! "$CREATE_STATUS" =~ ^2[0-9][0-9]$ ]] || ! jq -e '.success == true' "$CREATE_RESPONSE" >/dev/null; then
                jq -c '{success, errors: [.errors[]? | {code, message}]}' "$CREATE_RESPONSE" 2>/dev/null || true
                rm -f "$CUSTOM_DOMAIN_RESPONSE" "$CREATE_RESPONSE"
                echo "ERROR: Could not create the production R2 custom domain."
                exit 1
              fi
              DOMAIN_ZONE_ID="$ZONE_ID"
              rm -f "$CREATE_RESPONSE"
            fi

            CUSTOM_DOMAIN_READY=false
            for _ in $(seq 1 12); do
              if get_custom_domain && [ "$CUSTOM_DOMAIN_STATUS" = "200" ] && jq -e \
                '.success == true and .result.enabled == true and .result.status.ownership == "active" and .result.status.ssl == "active"' \
                "$CUSTOM_DOMAIN_RESPONSE" >/dev/null; then
                DOMAIN_ZONE_ID="$(jq -r '.result.zoneId // empty' "$CUSTOM_DOMAIN_RESPONSE")"
                CUSTOM_DOMAIN_READY=true
                break
              fi
              sleep 5
            done
            if [ "$CUSTOM_DOMAIN_READY" != "true" ]; then
              jq -c '.result | {domain, enabled, status, zoneId, zoneName}' "$CUSTOM_DOMAIN_RESPONSE" 2>/dev/null || true
              rm -f "$CUSTOM_DOMAIN_RESPONSE"
              echo "ERROR: Production R2 custom domain is not active."
              exit 1
            fi
            if [ -z "$DOMAIN_ZONE_ID" ]; then
              rm -f "$CUSTOM_DOMAIN_RESPONSE"
              echo "ERROR: Production R2 custom domain did not return a zone ID."
              exit 1
            fi
            CUSTOM_DOMAIN_PAYLOAD="$(jq -n \
              --arg domain "$CUSTOM_DOMAIN" \
              --arg zoneId "$DOMAIN_ZONE_ID" \
              '{domain: $domain, enabled: true, zoneId: $zoneId}')"
            if ! get_authoritative_dns; then
              rm -f "$CUSTOM_DOMAIN_RESPONSE"
              echo "ERROR: Could not query authoritative DNS for the production R2 custom domain."
              exit 1
            fi
            get_public_dns || PUBLIC_DNS_RESPONSE=""
            if [ -z "$AUTHORITATIVE_DNS_RESPONSE" ]; then
              echo "R2 custom domain is active but its DNS record is missing; reattaching it."
              DELETE_RESPONSE="$(mktemp)"
              DELETE_STATUS="$(curl -sS -o "$DELETE_RESPONSE" -w "%{http_code}" -X DELETE \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                "$CUSTOM_DOMAIN_URL")" || {
                rm -f "$CUSTOM_DOMAIN_RESPONSE" "$DELETE_RESPONSE"
                echo "ERROR: Could not remove the stale production R2 custom domain."
                exit 1
              }
              if [[ ! "$DELETE_STATUS" =~ ^2[0-9][0-9]$ ]] || ! jq -e '.success == true' "$DELETE_RESPONSE" >/dev/null; then
                jq -c '{success, errors: [.errors[]? | {code, message}]}' "$DELETE_RESPONSE" 2>/dev/null || true
                rm -f "$CUSTOM_DOMAIN_RESPONSE" "$DELETE_RESPONSE"
                echo "ERROR: Could not remove the stale production R2 custom domain."
                exit 1
              fi
              rm -f "$DELETE_RESPONSE"

              REATTACH_RESPONSE="$(mktemp)"
              REATTACHED=false
              for _ in $(seq 1 12); do
                REATTACH_STATUS="$(curl -sS -o "$REATTACH_RESPONSE" -w "%{http_code}" -X POST \
                  -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data "$CUSTOM_DOMAIN_PAYLOAD" \
                  "$CUSTOM_DOMAIN_COLLECTION_URL")" || true
                if [[ "$REATTACH_STATUS" =~ ^2[0-9][0-9]$ ]] && jq -e '.success == true' "$REATTACH_RESPONSE" >/dev/null; then
                  REATTACHED=true
                  break
                fi
                if [ "$REATTACH_STATUS" != "409" ]; then
                  break
                fi
                sleep 5
              done
              if [ "$REATTACHED" != "true" ]; then
                jq -c '{success, errors: [.errors[]? | {code, message}]}' "$REATTACH_RESPONSE" 2>/dev/null || true
                rm -f "$CUSTOM_DOMAIN_RESPONSE" "$REATTACH_RESPONSE"
                echo "ERROR: Could not reattach the production R2 custom domain."
                exit 1
              fi
              rm -f "$REATTACH_RESPONSE"

              if ! wait_for_dns; then
                jq -c '.result | {domain, enabled, status, zoneId, zoneName}' "$CUSTOM_DOMAIN_RESPONSE" 2>/dev/null || true
                printf 'authoritative DNS:\n%s\npublic DNS:\n%s\n' "$AUTHORITATIVE_DNS_RESPONSE" "$PUBLIC_DNS_RESPONSE"
                rm -f "$CUSTOM_DOMAIN_RESPONSE"
                echo "ERROR: Production R2 custom-domain DNS was not provisioned."
                exit 1
              fi
            fi

            if [ -z "$R2_PUBLIC_URL" ]; then
              rm -f "$CUSTOM_DOMAIN_RESPONSE"
              echo "ERROR: R2_PUBLIC_URL is required for the production media smoke test."
              exit 1
            fi
            SMOKE_KEY="healthchecks/r2-${GITHUB_SHA}.txt"
            SMOKE_FILE="$(mktemp)"
            SMOKE_RESPONSE="$(mktemp)"
            cleanup_r2_smoke() {
              bun x wrangler r2 object delete "$R2_BUCKET_NAME/$SMOKE_KEY" --remote --force >/dev/null 2>&1 || true
              rm -f "$CUSTOM_DOMAIN_RESPONSE" "$SMOKE_FILE" "$SMOKE_RESPONSE"
            }
            trap cleanup_r2_smoke EXIT
            SMOKE_CONTENT="rallycasts-r2-smoke:${GITHUB_SHA}"
            printf '%s\n' "$SMOKE_CONTENT" > "$SMOKE_FILE"
            bun x wrangler r2 object put "$R2_BUCKET_NAME/$SMOKE_KEY" \
              --file "$SMOKE_FILE" --content-type text/plain --remote --force
            SMOKE_URL="${R2_PUBLIC_URL%/}/$SMOKE_KEY"
            if ! curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 \
              "$SMOKE_URL" -o "$SMOKE_RESPONSE"; then
              echo "ERROR: Production R2 custom domain could not serve the smoke-test object."
              exit 1
            fi
            if ! cmp -s "$SMOKE_FILE" "$SMOKE_RESPONSE"; then
              echo "ERROR: Production R2 custom domain returned unexpected smoke-test contents."
              exit 1
            fi
            echo "Production R2 custom domain served the smoke-test object."

            jq -c '.result | {domain, enabled, status, zoneId, zoneName}' "$CUSTOM_DOMAIN_RESPONSE"
            printf 'authoritative DNS:\n%s\npublic DNS:\n%s\n' "$AUTHORITATIVE_DNS_RESPONSE" "$PUBLIC_DNS_RESPONSE"
            rm -f "$CUSTOM_DOMAIN_RESPONSE"
          fi
          # Alchemy v2 (Effect). --adopt preserves the v1 `adopt: true`
          # behavior: long-lived stages (prod, staging) take over the
          # resources v1 created on the first v2 deploy; fresh preview
          # stages adopt the shared R2 media bucket. After everything is
          # v2-owned this flag is a no-op. NEVER run the old v1 stack's
          # destroy afterwards — it still points at the same resources.
          # --yes answers the approval prompt the v2 CLI shows on every
          # deploy (there is no TTY in CI). Prod safety comes from PR
          # review + merge, same as v1 (which never prompted).
          cd packages/infra && bun alchemy deploy --stage ${{ env.STAGE }} --adopt --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          AD_BEACON_SECRET: ${{ secrets.AD_BEACON_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS || vars.ADMIN_EMAILS }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          E2E_SEED_TOKEN: ${{ secrets.E2E_SEED_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          MUX_SIGNING_KEY_ID: ${{ secrets.MUX_SIGNING_KEY_ID }}
          MUX_SIGNING_KEY_SECRET: ${{ secrets.MUX_SIGNING_KEY_SECRET }}
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
          MUX_WEBHOOK_SECRET: ${{ secrets.MUX_WEBHOOK_SECRET }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          PULL_REQUEST: ${{ github.event.number }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RADAR_SECRET_KEY: ${{ secrets.RADAR_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          VITE_FOURTHWALL_STOREFRONT_TOKEN: ${{ secrets.VITE_FOURTHWALL_STOREFRONT_TOKEN || vars.VITE_FOURTHWALL_STOREFRONT_TOKEN }}
          VITE_FOURTHWALL_STOREFRONT_URL: ${{ secrets.VITE_FOURTHWALL_STOREFRONT_URL || vars.VITE_FOURTHWALL_STOREFRONT_URL }}
          VITE_RADAR_PUBLISHABLE_KEY: ${{ secrets.VITE_RADAR_PUBLISHABLE_KEY }}
          # Demo fixtures for preview stages only — production builds never
          # set this flag, so no dummy data can ship to prod.
          VITE_DEMO_DATA: ${{ env.STAGE != 'prod' && 'true' || '' }}

      - name: Resolve D1 database
        run: |
          set -euo pipefail
          if [ "${{ env.STAGE }}" = "prod" ]; then
            WORKER_NAME="rallycasts-server"
          else
            WORKER_NAME="rallycasts-server-${{ env.STAGE }}"
          fi
          echo "D1 databases visible to this token (names only):"
          (cd apps/server && bun x wrangler d1 list --json 2>/dev/null | jq -r '.[].name')
          SETTINGS_FILE="$(mktemp)"
          if curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings" \
            > "$SETTINGS_FILE"; then
            RESOLVED_ID="$(jq -r '.result.bindings[]? | select(.name == "DB" and .type == "d1") | .id // empty' "$SETTINGS_FILE")"
            rm -f "$SETTINGS_FILE"
            if [ -n "$RESOLVED_ID" ]; then
              echo "Resolved the database from the $WORKER_NAME worker's DB binding."
              echo "D1_DATABASE_ID=$RESOLVED_ID" >> "$GITHUB_ENV"
              exit 0
            fi
          else
            rm -f "$SETTINGS_FILE"
          fi
          echo "Could not resolve the DB binding from $WORKER_NAME; falling back to name-based execution."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Repair D1 migrations bookkeeping
        run: |
          set -euo pipefail
          if [ "${{ env.STAGE }}" = "prod" ]; then
            DB_NAME="rallycaststv-db"
          else
            DB_NAME="rallycaststv-db-${{ env.STAGE }}"
          fi
          bash scripts/repair-d1-migrations-schema.sh "$DB_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Validate D1 migrations bookkeeping
        run: |
          set -euo pipefail
          if [ "${{ env.STAGE }}" = "prod" ]; then
            DB_NAME="rallycaststv-db"
          else
            DB_NAME="rallycaststv-db-${{ env.STAGE }}"
          fi
          bash scripts/validate-d1-migrations-schema.sh "$DB_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 Migrations
        run: |
          set -euo pipefail
          if [ "${{ env.STAGE }}" = "prod" ]; then
            DB_NAME="rallycaststv-db"
          else
            DB_NAME="rallycaststv-db-${{ env.STAGE }}"
          fi
          # Schema ships via wrangler (not Alchemy): the v2 layout validator
          # rejects our drizzle-kit 0.31 meta/ directory, and converting it
          # would break the vitest pool's migration reader. Idempotent —
          # already-applied migrations are skipped.
          # NOTE: prefer the database ID resolved from the deployed worker's
          # DB binding; a name lookup is ambiguous if state drift ever leaves
          # more than one database with the same name.
          cd apps/server
          TMP_CONFIG="$(mktemp --suffix=.json)"
          DB_ID="${D1_DATABASE_ID:-}"
          if [ -z "$DB_ID" ]; then
            DB_ID="$(bun x wrangler d1 list --json | jq -r --arg name "$DB_NAME" '.[] | select(.name == $name) | .uuid // empty')"
          fi
          if [ -z "$DB_ID" ]; then
            echo "ERROR: D1 database $DB_NAME not found."
            exit 1
          fi
          printf '{"d1_databases":[{"binding":"DB","database_name":"%s","database_id":"%s","migrations_dir":"%s"}]}' \
            "$DB_NAME" "$DB_ID" "$GITHUB_WORKSPACE/packages/db/src/migrations" > "$TMP_CONFIG"
          bun x wrangler d1 migrations apply DB --remote --config "$TMP_CONFIG"
          rm -f "$TMP_CONFIG"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Production D1 Migrations
        if: ${{ env.STAGE == 'prod' }}
        run: |
          set -euo pipefail
          if [ -n "${D1_DATABASE_ID:-}" ]; then
            VERIFY_CONFIG="$(mktemp --suffix=.json)"
            printf '{"d1_databases":[{"binding":"DB","database_name":"rallycaststv-db","database_id":"%s","migrations_dir":"%s"}]}' \
              "$D1_DATABASE_ID" "$GITHUB_WORKSPACE/packages/db/src/migrations" > "$VERIFY_CONFIG"
            MIGRATIONS_JSON="$(cd apps/server && bun x wrangler d1 execute DB --remote --config "$VERIFY_CONFIG" --json \
              --command 'SELECT name FROM d1_migrations ORDER BY id')"
            rm -f "$VERIFY_CONFIG"
          else
            MIGRATIONS_JSON="$(cd apps/server && bun x wrangler d1 execute rallycaststv-db --remote --json \
              --command 'SELECT name FROM d1_migrations ORDER BY id')"
          fi
          printf '%s\n' "$MIGRATIONS_JSON" | jq -e '.[0].success == true' >/dev/null
          for migration in \
            0014_rich_giant_girl \
            0015_narrow_mercury \
            0016_square_bedlam \
            0017_milky_maestro \
            0018_adorable_iron_monger \
            0019_lovely_master_chief \
            0020_motionless_shriek \
            0021_secret_talkback \
            0022_true_the_stranger; do
            if ! printf '%s\n' "$MIGRATIONS_JSON" | jq -e --arg migration "$migration" \
              'any(.[]?.results[]?; .name == $migration or .name == ($migration + ".sql"))' \
              >/dev/null; then
              echo "ERROR: Production D1 migration is missing: $migration"
              printf '%s\n' "$MIGRATIONS_JSON"
              exit 1
            fi
          done
          echo "Production D1 migrations 0014–0022 are applied."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  cleanup:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Safety Check
        run: |
          if [ "${{ env.STAGE }}" = "prod" ]; then
            echo "ERROR: Cannot destroy prod environment in cleanup job"
            exit 1
          fi

      - name: Destroy Preview Environment
        run: |
          cd packages/infra && bun alchemy destroy --stage ${{ env.STAGE }} --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          PULL_REQUEST: ${{ github.event.number }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
