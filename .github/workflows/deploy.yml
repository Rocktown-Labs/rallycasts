name: Deploy Application

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || (github.ref == 'refs/heads/master' && 'prod' || github.ref_name) }}
  ALCHEMY_STATE_FORCE_UPDATE: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

jobs:
  deploy:
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun x ultracite check

      - name: Type Check
        run: bun run check-types --filter=server

      - name: Build
        run: bun run build --filter=server

      - name: Test
        run: bun run test --filter=server
        env:
          BETTER_AUTH_SECRET: test-secret-test-secret-test-secret-test-secret
          BETTER_AUTH_URL: http://localhost:3000
          CORS_ORIGIN: http://localhost:3001
          GOOGLE_GENERATIVE_AI_API_KEY: test-google-key
          GOOGLE_PLACES_API_KEY: test-google-places-key
          RADAR_SECRET_KEY: test-radar-key

      - name: Deploy
        run: |
          if [ -z "$R2_BUCKET_NAME" ] || [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_PUBLIC_URL" ]; then
            SETTINGS_FILE="$(mktemp)"
            if curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/rallycasts-server/settings" \
              > "$SETTINGS_FILE"; then
              if [ -z "$R2_BUCKET_NAME" ]; then
                R2_BUCKET_NAME="$(jq -r '.result.bindings[]? | select(.name == "MEDIA_BUCKET" and .type == "r2_bucket") | .bucket_name // empty' "$SETTINGS_FILE")"
                export R2_BUCKET_NAME
              fi
              if [ -z "$R2_ACCOUNT_ID" ]; then
                R2_ACCOUNT_ID="$(jq -r '.result.bindings[]? | select(.name == "R2_ACCOUNT_ID" and .type == "plain_text") | .text // empty' "$SETTINGS_FILE")"
                export R2_ACCOUNT_ID
              fi
              if [ -z "$R2_PUBLIC_URL" ]; then
                R2_PUBLIC_URL="$(jq -r '.result.bindings[]? | select(.name == "R2_PUBLIC_URL" and .type == "plain_text") | .text // empty' "$SETTINGS_FILE")"
                export R2_PUBLIC_URL
              fi
            fi
            rm -f "$SETTINGS_FILE"
          fi
          if [ "${{ env.STAGE }}" = "prod" ] && [ -z "$R2_BUCKET_NAME" ]; then
            echo "ERROR: R2_BUCKET_NAME is not set and MEDIA_BUCKET could not be inherited from rallycasts-server."
            exit 1
          fi
          if [ "${{ env.STAGE }}" = "prod" ]; then
            if ! R2_BUCKETS="$(curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets")"; then
              echo "ERROR: Could not list production R2 buckets."
              exit 1
            fi
            if ! printf "%s" "$R2_BUCKETS" | jq -e '.success == true and (.result.buckets | type == "array")' >/dev/null; then
              echo "ERROR: Cloudflare returned an invalid production R2 bucket list."
              exit 1
            fi
            if ! printf "%s" "$R2_BUCKETS" | jq -e --arg bucket "$R2_BUCKET_NAME" 'any(.result.buckets[]?; .name == $bucket)' >/dev/null; then
              echo "Production R2 bucket is missing; creating it."
              bun x wrangler r2 bucket create "$R2_BUCKET_NAME"
            fi

            CUSTOM_DOMAIN_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$R2_BUCKET_NAME/domains/custom/media.rallycasts.com"
            CUSTOM_DOMAIN_RESPONSE="$(mktemp)"
            CUSTOM_DOMAIN_STATUS="$(curl -sS -o "$CUSTOM_DOMAIN_RESPONSE" -w "%{http_code}" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$CUSTOM_DOMAIN_URL")" || {
              rm -f "$CUSTOM_DOMAIN_RESPONSE"
              echo "ERROR: Could not inspect the production R2 custom domain."
              exit 1
            }
            if [ "$CUSTOM_DOMAIN_STATUS" = "404" ]; then
              if ! curl -fsS -X POST \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data '{"domain":"media.rallycasts.com","enabled":true}' \
                "$CUSTOM_DOMAIN_URL" | jq -e '.success == true' >/dev/null; then
                rm -f "$CUSTOM_DOMAIN_RESPONSE"
                echo "ERROR: Could not create the production R2 custom domain."
                exit 1
              fi
            elif [ "$CUSTOM_DOMAIN_STATUS" != "200" ] || ! jq -e '.success == true' "$CUSTOM_DOMAIN_RESPONSE" >/dev/null; then
              rm -f "$CUSTOM_DOMAIN_RESPONSE"
              echo "ERROR: Cloudflare returned an invalid production R2 custom-domain response."
              exit 1
            fi
            rm -f "$CUSTOM_DOMAIN_RESPONSE"
          fi
          printf "%s" "$ALCHEMY_STATE_TOKEN" | bun x wrangler secret put STATE_TOKEN --name alchemy-state-service
          cd packages/infra && bun x alchemy deploy --stage ${{ env.STAGE }}
        env:
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          PULL_REQUEST: ${{ github.event.number }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RADAR_SECRET_KEY: ${{ secrets.RADAR_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          VITE_RADAR_PUBLISHABLE_KEY: ${{ secrets.VITE_RADAR_PUBLISHABLE_KEY }}

  cleanup:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Safety Check
        run: |
          if [ "${{ env.STAGE }}" = "prod" ]; then
            echo "ERROR: Cannot destroy prod environment in cleanup job"
            exit 1
          fi

      - name: Destroy Preview Environment
        run: |
          printf "%s" "$ALCHEMY_STATE_TOKEN" | bun x wrangler secret put STATE_TOKEN --name alchemy-state-service
          cd packages/infra && bun x alchemy destroy --stage ${{ env.STAGE }}
        env:
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          PULL_REQUEST: ${{ github.event.number }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
