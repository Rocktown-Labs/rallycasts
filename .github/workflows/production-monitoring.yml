name: Production Monitoring

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: production-monitoring
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke-and-queues:
    runs-on: ubuntu-latest
    steps:
      - name: Check public production endpoints
        run: |
          set -euo pipefail

          check_endpoint() {
            local url="$1"
            local response_file
            response_file="$(mktemp)"
            trap 'rm -f "$response_file"' RETURN

            curl --fail --silent --show-error --retry 4 --retry-all-errors \
              --retry-delay 5 --max-time 30 "$url" -o "$response_file"
            test -s "$response_file"
            echo "Healthy: $url"
          }

          check_endpoint "https://api.rallycasts.com/health"
          check_endpoint "https://api.rallycasts.com/"
          check_endpoint "https://api.rallycasts.com/api/v1/videos"
          check_endpoint "https://api.rallycasts.com/api/v1/events"
          check_endpoint "https://rallycasts.com/"

      - name: Check production queue backlogs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERROR: Cloudflare credentials are required for queue monitoring."
            exit 1
          fi

          QUEUES_RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues?per_page=1000")"
          printf '%s' "$QUEUES_RESPONSE" | jq -e \
            '.success == true and (.result | type == "array")' >/dev/null

          check_queue() {
            local queue_name="$1"
            local kind="$2"
            local queue_id
            local metrics
            local backlog
            local oldest
            local age_ms

            queue_id="$(printf '%s' "$QUEUES_RESPONSE" | jq -r --arg name "$queue_name" \
              '.result[]? | select(.queue_name == $name) | .queue_id' | head -n 1)"
            if [ -z "$queue_id" ] || [ "$queue_id" = "null" ]; then
              echo "ERROR: Production queue is missing: $queue_name"
              exit 1
            fi

            metrics="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues/$queue_id/metrics")"
            printf '%s' "$metrics" | jq -e \
              '.success == true and (.result.backlog_count | type == "number")' >/dev/null

            backlog="$(printf '%s' "$metrics" | jq -r '.result.backlog_count')"
            oldest="$(printf '%s' "$metrics" | jq -r '.result.oldest_message_timestamp_ms // 0')"
            echo "$queue_name backlog=$backlog oldest_message_timestamp_ms=$oldest"

            if [ "$kind" = "dlq" ] && [ "$backlog" -gt 0 ]; then
              echo "ERROR: Production dead-letter queue is not empty: $queue_name"
              exit 1
            fi

            if [ "$kind" = "primary" ] && [ "$backlog" -gt 0 ] && [ "$oldest" -gt 0 ]; then
              age_ms="$(( $(date +%s%3N) - oldest ))"
              if [ "$age_ms" -gt 900000 ]; then
                echo "ERROR: Production queue has a message older than 15 minutes: $queue_name"
                exit 1
              fi
            fi
          }

          check_queue "rallycasts-geofence-events-prod" primary
          check_queue "rallycasts-geofence-events-dlq-prod" dlq
          check_queue "rallycasts-event-activity-prod" primary
          check_queue "rallycasts-event-activity-dlq-prod" dlq
